name: Déployer sur GitHub Pages

# Construit l'invitation en statique (next export) et la publie
# sur https://ivandjeapro-gif.github.io/Weeding/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Générer le client Prisma
        run: bunx prisma generate

      - name: Build statique (export GitHub Pages)
        run: bun run build:pages
        env:
          PAGES_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Déterminer le dossier d'export
        run: |
          if [ -d out ]; then
            echo "PAGES_DIR=out" >> "$GITHUB_ENV"
          else
            # Next 16 + Turbopack écrit l'export dans le distDir
            echo "PAGES_DIR=.next-pages" >> "$GITHUB_ENV"
          fi

      - name: Publier l'artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
